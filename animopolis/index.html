<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3efe4">
<title>Animopolis</title>
<meta name="description" content="Enquêtes à la loupe dans une immense ville dessinée peuplée d'animaux.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--paper:#f3efe4;--ink:#1d1b18;--red:#d8352a;--card:#fffdf7;--muted:#6b665c;--line:#1d1b18;--shadow:0 6px 0 rgba(29,27,24,.18)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--card:#26231f;--ink:#f1ece0;--muted:#b5ad9d;--line:#f1ece0;--shadow:0 6px 0 rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--card:#26231f;--ink:#f1ece0;--muted:#b5ad9d;--line:#f1ece0;--shadow:0 6px 0 rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Patrick Hand","Comic Sans MS",cursive;font-size:18px;overscroll-behavior:none}
canvas#map{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;touch-action:none;cursor:grab;display:block}
canvas#map:active{cursor:grabbing}
button{font:inherit;color:inherit;cursor:pointer}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;pointer-events:none}
.logo{pointer-events:auto;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px 12px 2px;box-shadow:var(--shadow);line-height:1}
.logo b{font-size:24px;letter-spacing:.5px}.logo small{display:block;font-size:13px;color:var(--muted)}
.pill{pointer-events:auto;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);font-size:18px}
.zoom{position:fixed;right:16px;top:50%;transform:translateY(-60%);display:flex;flex-direction:column;gap:8px}
.zoom button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-size:24px;line-height:1;padding:0}
.card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(560px,calc(100vw - 32px));background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px 12px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-head button{background:none;border:0;padding:0;font-size:19px;text-align:left;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.badge:empty{display:none}
.badge{border:2px solid var(--line);border-radius:999px;padding:0 10px;font-size:16px;white-space:nowrap}
#question{margin:6px 0 10px;font-size:19px;line-height:1.25}
.actions{display:flex;gap:8px}
.actions button{flex:1;border:2px solid var(--line);background:transparent;border-radius:12px;padding:6px 4px;font-size:17px}
.actions button.main{background:var(--ink);color:var(--card)}
.card.min #question,.card.min .actions{display:none}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translateX(-50%) translateY(-10px);background:var(--ink);color:var(--card);padding:6px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;font-size:18px}
#toast.on{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(29,27,24,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:10}
.modal.hidden{display:none}
.sheet{position:relative;background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:var(--shadow);width:min(560px,100%);max-height:min(82vh,82dvh);overflow:auto;padding:18px 18px 16px}
@media (min-height:700px) and (min-width:700px){.modal{align-items:center}}
.sheet h2{margin:0 0 6px;font-size:28px;font-weight:400;line-height:1.1}
.sheet h3{margin:14px 0 6px;font-size:21px;font-weight:400}
.sheet p{margin:6px 0;line-height:1.3}
.sheet .close{position:absolute;right:10px;top:8px;border:0;background:none;font-size:30px;line-height:1;padding:4px 8px}
.btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--ink);color:var(--card);border-radius:14px;padding:10px;font-size:20px}
.btn.ghost{background:transparent;color:var(--ink)}
.cases{display:grid;gap:10px;margin-top:10px}
.case{display:flex;gap:12px;align-items:center;text-align:left;border:2px solid var(--line);border-radius:14px;background:transparent;padding:8px 12px}
.case .t{font-size:21px;line-height:1.1}.case .m{font-size:15px;color:var(--muted)}
.case .done{margin-left:auto;font-size:15px;white-space:nowrap}
.case.active{outline:3px solid var(--red);outline-offset:2px}
.cast{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:8px}
.who{border:2px solid var(--line);border-radius:14px;padding:6px;text-align:center;background:#fffdf7;color:#1d1b18}
.who canvas{display:block;margin:0 auto;width:90px;height:100px}
.who b{display:block;font-weight:400;font-size:18px;line-height:1.1}.who span{font-size:14px;color:#6b665c}
.steps{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.steps li{border:2px solid var(--line);border-radius:12px;padding:8px 10px;line-height:1.25}
.steps li.lock{opacity:.5;border-style:dashed}
.steps .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;font-size:15px;margin-right:6px}
.steps .ok{display:block;color:var(--muted);font-size:16px;margin-top:4px}
.steps button{margin-top:6px;border:2px solid var(--line);background:transparent;border-radius:10px;padding:2px 10px;font-size:15px}
.stamp{display:inline-block;border:3px solid var(--red);color:var(--red);transform:rotate(-6deg);padding:2px 12px;border-radius:8px;font-size:24px;margin:6px 0}
.legend{font-size:15px;color:var(--muted)}
</style>
</head>
<body>
<canvas id="map" aria-label="Carte de la ville d'Animopolis"></canvas>
<header class="top">
  <div class="logo"><b>Animopolis</b><small>enquêtes à la loupe</small></div>
  <button class="pill" id="btnCases">Dossiers</button>
</header>
<div class="zoom">
  <button id="zin" aria-label="Zoomer">+</button>
  <button id="zout" aria-label="Dézoomer">−</button>
  <button id="zfit" aria-label="Voir toute la ville">⤢</button>
</div>
<section id="card" class="card">
  <div class="card-head"><button id="caseTitle"></button><span id="stepNum" class="badge"></span></div>
  <p id="question"></p>
  <div class="actions">
    <button id="btnHint">Indice</button>
    <button id="btnCast">Personnages</button>
    <button id="btnSteps">Étapes</button>
  </div>
</section>
<div id="toast"></div>
<div id="modal" class="modal hidden"><div class="sheet"><button class="close" aria-label="Fermer">×</button><div id="modalBody"></div></div></div>

<script>
'use strict';
/* =========================================================
   ANIMOPOLIS — jeu d'enquête "cherche et trouve" sur une
   immense carte dessinée en noir et blanc.
   ========================================================= */
const INK='#1d1b18', WHITE='#ffffff', GREY='#b9b3a6', LGREY='#e2ddd0', PAPER='#f3efe4', RED='#d8352a';
const PI=Math.PI, TAU=Math.PI*2;

/* ---------- aléatoire déterministe ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20261110);
const R=(a,b)=>a+rnd()*(b-a), RI=(a,b)=>Math.floor(R(a,b+1)), pick=a=>a[Math.floor(rnd()*a.length)];

/* ---------- primitives de dessin ---------- */
function P(c,pts,f){c.beginPath();c.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)c.lineTo(pts[i][0],pts[i][1]);c.closePath();if(f){c.fillStyle=f;c.fill();}c.stroke();}
function E(c,x,y,rx,ry,f,rot){c.beginPath();c.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot||0,0,TAU);if(f){c.fillStyle=f;c.fill();}c.stroke();}
function C(c,x,y,r,f){E(c,x,y,r,r,f);}
function D(c,x,y,r,f){c.beginPath();c.arc(x,y,r||.75,0,TAU);c.fillStyle=f||INK;c.fill();}
function Rc(c,x,y,w,h,f){if(f){c.fillStyle=f;c.fillRect(x,y,w,h);}c.strokeRect(x,y,w,h);}
function L(c,x1,y1,x2,y2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();}
function stripesIn(c,x0,y0,x1,y1,step,thick,vertical,col){c.fillStyle=col||INK;if(vertical){for(let x=x0;x<x1;x+=step)c.fillRect(x,y0,thick,y1-y0);}else{for(let y=y0;y<y1;y+=step)c.fillRect(x0,y,x1-x0,thick);}}

/* motif d'un vêtement (le chemin courant doit être déjà construit) */
function fillWith(c,fill,bb){
  if(fill==='black'){c.fillStyle=INK;c.fill();}
  else if(fill==='grey'){c.fillStyle='#a8a296';c.fill();}
  else{
    c.fillStyle=WHITE;c.fill();
    if(fill==='stripes'||fill==='dots'||fill==='check'){
      c.save();c.clip();c.fillStyle=INK;
      const[x0,y0,x1,y1]=bb;
      if(fill==='stripes')stripesIn(c,x0,y0+.6,x1,y1,2.6,1.15,false);
      else if(fill==='check'){stripesIn(c,x0,y0,x1,y1,3,1,false,'#6e685d');stripesIn(c,x0,y0,x1,y1,3,1,true,'#6e685d');}
      else{for(let y=y0+1.2,k=0;y<y1;y+=2.5,k++)for(let x=x0+(k%2?1.25:0);x<x1;x+=2.5){c.beginPath();c.arc(x,y,.6,0,TAU);c.fill();}}
      c.restore();
    }
  }
  c.stroke();
}

/* ---------- les têtes d'animaux ---------- */
const HEADS=['cat','fox','rabbit','bear','mouse','pig','owl','dog','elephant','frog','duck','croc','hedgehog','penguin','lion'];
function drawHead(c,s,d){
  const h=s.head, r=5.2;
  c.lineWidth=1.05;c.strokeStyle=INK;
  let hf=WHITE;
  // oreilles et éléments derrière la tête
  switch(h){
    case 'cat':P(c,[[-4.6,-2],[-4.4,-8.6],[-.8,-4.6]],WHITE);P(c,[[4.6,-2],[4.4,-8.6],[.8,-4.6]],WHITE);break;
    case 'fox':P(c,[[-4.8,-1.5],[-5.3,-10.2],[-.6,-4.4]],WHITE);P(c,[[4.8,-1.5],[5.3,-10.2],[.6,-4.4]],WHITE);D(c,-4.4,-7.4,.9);D(c,4.4,-7.4,.9);break;
    case 'rabbit':E(c,-2.3,-9.2,1.8,5.4,WHITE,-.15);E(c,2.3,-9.2,1.8,5.4,WHITE,.15);break;
    case 'bear':C(c,-4,-4.1,2.2,WHITE);C(c,4,-4.1,2.2,WHITE);break;
    case 'mouse':C(c,-4.7,-4,3.3,WHITE);C(c,4.7,-4,3.3,WHITE);break;
    case 'pig':P(c,[[-4.5,-2.5],[-4.9,-6.9],[-1.5,-4.8]],WHITE);P(c,[[4.5,-2.5],[4.9,-6.9],[1.5,-4.8]],WHITE);break;
    case 'owl':P(c,[[-4.5,-2],[-4.8,-7.8],[-1.8,-4.8]],INK);P(c,[[4.5,-2],[4.8,-7.8],[1.8,-4.8]],INK);break;
    case 'elephant':hf='#d9d4c8';E(c,-5.9,0,3.9,4.9,hf);E(c,5.9,0,3.9,4.9,hf);break;
    case 'croc':hf='#d8d4c6';break;
    case 'penguin':hf=INK;break;
    case 'lion':{c.beginPath();for(let i=0;i<=18;i++){const a=i*TAU/18,rr=i%2?r+3.6:r+1.6;const px=Math.cos(a)*rr,py=Math.sin(a)*rr;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();c.fillStyle='#d9cfae';c.fill();c.stroke();C(c,-3.6,-3.8,1.5,WHITE);C(c,3.6,-3.8,1.5,WHITE);break;}
    case 'hedgehog':{c.beginPath();for(let i=0;i<=14;i++){const a=PI+i*PI/14,rr=i%2?r+3.4:r-.3;const px=Math.cos(a)*rr*1.08,py=Math.sin(a)*rr+.3;i?c.lineTo(px,py):c.moveTo(px,py);}c.closePath();c.fillStyle=INK;c.fill();break;}
  }
  C(c,0,0,r,hf);
  // museaux longs
  if(h==='croc'){P(c,[[d*2.5,-.9],[d*11,.2],[d*11.3,3.4],[d*2.5,3.6]],hf);c.lineWidth=.6;c.beginPath();for(let k=0;k<5;k++){const xx=d*(4+k*1.5);c.moveTo(xx,2.1);c.lineTo(xx+d*.7,3.3);}c.stroke();D(c,d*10.3,.8,.45);C(c,-1.2,-4.8,1.3,hf);C(c,1.6,-4.8,1.3,hf);c.lineWidth=1.05;}
  if(h==='duck'){E(c,d*4.2,1.5,3.4,1.5,'#e8deb8');}
  if(h==='penguin'){c.lineWidth=.6;E(c,0,.6,3.7,3.9,WHITE);c.lineWidth=1.05;}
  // yeux
  if(h==='owl'){C(c,-2,-.8,1.9,WHITE);C(c,2,-.8,1.9,WHITE);D(c,-2+d*.4,-.8,.85);D(c,2+d*.4,-.8,.85);P(c,[[-.8,1],[.8,1],[0,2.9]],INK);}
  else if(h==='frog'){C(c,-2.6,-4.6,2.1,WHITE);C(c,2.6,-4.6,2.1,WHITE);D(c,-2.6,-4.6,.85);D(c,2.6,-4.6,.85);c.beginPath();c.arc(0,.2,3.1,.35,PI-.35);c.stroke();}
  else if(h==='croc'){D(c,-1.2,-4.8,.6);D(c,1.6,-4.8,.6);}
  else{D(c,-1.9+(h==='duck'?d*.8:0),-.8);D(c,1.9+(h==='duck'?d*.8:0),-.8);}
  c.lineWidth=.55;
  switch(h){
    case 'cat':P(c,[[-.7,1],[.7,1],[0,1.8]],INK);L(c,-1.5,1.8,-5.6,1.1);L(c,-1.5,2.4,-5.6,2.9);L(c,1.5,1.8,5.6,1.1);L(c,1.5,2.4,5.6,2.9);break;
    case 'fox':c.beginPath();c.moveTo(-3.4,.6);c.lineTo(0,3.9);c.lineTo(3.4,.6);c.stroke();D(c,0,3.3,.85);break;
    case 'rabbit':D(c,0,1.3,.6);c.fillStyle=WHITE;c.fillRect(-.75,2.2,1.5,1.5);c.strokeRect(-.75,2.2,1.5,1.5);break;
    case 'bear':c.lineWidth=.9;E(c,0,2.1,2.3,1.6,WHITE);D(c,0,1.5,.75);break;
    case 'mouse':D(c,0,1.6,.75);L(c,-1.2,2,-5,1.4);L(c,1.2,2,5,1.4);L(c,-1.2,2.4,-5,3);L(c,1.2,2.4,5,3);break;
    case 'pig':c.lineWidth=.9;E(c,0,1.9,2.2,1.5,WHITE);D(c,-.75,1.9,.45);D(c,.75,1.9,.45);break;
    case 'dog':E(c,0,1.4,1,.75,INK);c.beginPath();c.moveTo(-1.2,2.8);c.quadraticCurveTo(0,3.6,1.2,2.8);c.stroke();c.lineWidth=1;E(c,-5,.6,1.8,3.9,INK,.3);E(c,5,.6,1.8,3.9,INK,-.3);break;
    case 'elephant':c.lineCap='round';c.beginPath();c.moveTo(0,.6);c.quadraticCurveTo(0,6,d*3.2,8.2);c.lineWidth=3.4;c.strokeStyle=INK;c.stroke();c.lineWidth=1.9;c.strokeStyle='#d9d4c8';c.stroke();c.strokeStyle=INK;break;
    case 'hedgehog':D(c,0,1.7,.95);break;
    case 'penguin':c.lineWidth=.6;P(c,[[-1.2,1.2],[1.2,1.2],[0,3.2]],'#e6c14a');break;
    case 'lion':c.lineWidth=.8;E(c,0,2,2.2,1.5,WHITE);D(c,0,1.4,.7);break;
  }
  c.lineWidth=1.05;
  // couvre-chefs
  switch(s.hat){
    case 'top':c.fillStyle=INK;c.fillRect(-3.4,-13.6,6.8,8.8);c.fillRect(-5.5,-5.5,11,1.5);c.fillStyle=WHITE;c.fillRect(-3.4,-7.5,6.8,1);break;
    case 'cap':c.beginPath();c.arc(0,-3.1,5.35,PI,0);c.closePath();c.fillStyle=INK;c.fill();c.fillRect(d>0?0:-7.6,-3.7,7.6,1.5);break;
    case 'beret':E(c,d*.9,-4.9,5.9,2.05,INK,d*.15);D(c,d*.6,-7.2,.9);break;
    case 'bow':P(c,[[2.2,-5.6],[5.2,-7.8],[5.4,-3.8]],INK);P(c,[[2.2,-5.6],[-.6,-8],[-.3,-3.9]],INK);break;
    case 'chef':C(c,-2.6,-9.3,2.8,WHITE);C(c,2.6,-9.3,2.8,WHITE);C(c,0,-11.2,3,WHITE);Rc(c,-3.6,-8.2,7.2,3.4,WHITE);break;
    case 'police':P(c,[[-4.6,-4.3],[4.6,-4.3],[5.8,-9.2],[-5.8,-9.2]],INK);c.fillStyle=INK;c.fillRect(d>0?-1:-6,-4.8,7,1.5);D(c,0,-6.8,.9,WHITE);break;
    case 'straw':E(c,0,-4.8,7.6,1.6,'#efe6c8');E(c,0,-6.4,3.9,2.4,'#efe6c8');c.fillStyle=INK;c.fillRect(-3.8,-5.6,7.6,.9);break;
    case 'mask':c.fillStyle=INK;c.fillRect(-5.3,-2.3,10.6,2.9);D(c,-1.9,-.9,.7,WHITE);D(c,1.9,-.9,.7,WHITE);break;
    case 'flower':for(let k=0;k<5;k++){const a=k*TAU/5;C(c,3.4+Math.cos(a)*1.2,-4.6+Math.sin(a)*1.2,.9,WHITE);}D(c,3.4,-4.6,.6);break;
    case 'captain':Rc(c,-4.6,-9.6,9.2,4.6,WHITE);c.fillStyle=INK;c.fillRect(-4.6,-5.6,9.2,1.2);c.fillRect(d>0?-.5:-6.8,-5.2,7.3,1.4);D(c,0,-7.6,.9,'#e6c14a');break;
    case 'bandana':P(c,[[-5.3,-2.4],[5.3,-2.4],[3.6,-6.6],[-3.6,-6.6]],INK);P(c,[[-d*5,-3.4],[-d*8,-5.4],[-d*7.6,-1.6]],INK);D(c,d*1.9,-.8,1.4,INK);c.lineWidth=.4;L(c,-5,-2.8,5,-.6);c.lineWidth=1.05;break;
    case 'helmet':c.beginPath();c.arc(0,-2.6,5.8,PI,0);c.closePath();c.fillStyle=WHITE;c.fill();c.stroke();L(c,-2,-8,-2,-3);L(c,2,-8,2,-3);break;
    case 'glasses':c.lineWidth=.7;C(c,-1.9,-.8,1.5);C(c,1.9,-.8,1.5);L(c,-.4,-.8,.4,-.8);break;
  }
}

/* ---------- les poses ---------- */
function POSE(p,d,tt,hip){
  const std=[[[-2,hip],[-2.3,0]],[[2,hip],[2.3,0]]];
  switch(p){
    case 'walk':return{F:[d*5.6,hip-4],B:[-d*5,hip+.5],legs:[[[-1.5,hip],[-4.2,0]],[[1.5,hip],[4,0]]]};
    case 'run':return{F:[d*7.5,tt+4],B:[-d*6.8,tt+9.5],legs:[[[0,hip],[d*4.6,hip+5],[d*4.8,0]],[[0,hip],[-d*3.2,hip+6],[-d*7.8,-2.5]]],lean:true};
    case 'arms_up':return{F:[d*7,tt-6.5],B:[-d*7,tt-6.5],legs:std};
    case 'climb':return{F:[d*5,tt-6],B:[-d*5,tt-3.5],legs:[[[-2,hip],[-2.5,0]],[[2,hip],[4.2,hip+4],[3.6,-5]]]};
    case 'point':case 'give':return{F:[d*10.5,tt+3.5],B:[-d*5.5,hip-1],legs:std};
    case 'sit':return{F:[d*4.5,hip+1.5],B:[-d*4.5,hip+1.5],legs:[[[-2,hip],[-2.4,0]],[[2,hip],[2.4,0]]]};
    case 'dig':return{F:[d*6.5,tt+5],B:[d*2.5,tt+9.5],legs:[[[-2,hip],[-3.6,0]],[[2,hip],[3.6,0]]]};
    case 'carry':return{F:[d*3,tt+7],B:[-d*3,tt+7],legs:std};
    case 'row':return{F:[d*7,tt+7],B:[d*3.5,tt+9],legs:[]};
    default:return{F:[d*5.6,hip-1],B:[-d*5.6,hip-1],legs:std};
  }
}

function bodyPath(c,s,tt,hip){
  c.beginPath();
  if(s.body==='dress'){c.moveTo(-3.3,tt+.5);c.quadraticCurveTo(-3.3,tt,-2.5,tt);c.lineTo(2.5,tt);c.quadraticCurveTo(3.3,tt,3.3,tt+.5);c.lineTo(7.2,hip+4.2);c.lineTo(-7.2,hip+4.2);}
  else if(s.body==='suit'||s.body==='shirt'){c.moveTo(-4.3,tt+1.2);c.quadraticCurveTo(-4.3,tt,-3,tt);c.lineTo(3,tt);c.quadraticCurveTo(4.3,tt,4.3,tt+1.2);c.lineTo(4.1,hip);c.lineTo(-4.1,hip);}
  else{c.moveTo(-4.1,tt+1.2);c.quadraticCurveTo(-4.1,tt,-3,tt);c.lineTo(3,tt);c.quadraticCurveTo(4.1,tt,4.1,tt+1.2);c.lineTo(5.7,hip+2.2);c.lineTo(-5.7,hip+2.2);}
  c.closePath();
}

function drawTinyDog(c,x,y,d){
  c.lineWidth=.8;L(c,x-2,y-2,x-2.3,y);L(c,x+2,y-2,x+2.3,y);E(c,x,y-3,3.2,1.8,WHITE);C(c,x+d*3.4,y-5,1.7,WHITE);E(c,x+d*2.6,y-4.6,.7,1.3,INK);L(c,x-d*3,y-3.4,x-d*4.6,y-5.4);D(c,x+d*4,y-5.2,.35);
}

/* ---------- personnage complet ---------- */
function drawChar(c,x,y,s){
  c.save();c.translate(x,y);
  if(s.scale)c.scale(s.scale,s.scale);
  if(s.head==='ghost'){drawGhost(c);c.restore();return;}
  let pose=s.pose||'stand';
  const fallen=pose==='fallen', lying=pose==='lie', sleeping=pose==='sleep';
  if(fallen||lying){c.translate(15,-4);c.rotate(-PI/2);pose=fallen?'arms_up':'stand';}
  if(sleeping)pose='sit';
  const d=s.flip?-1:1;
  c.lineJoin='round';c.lineCap='round';c.strokeStyle=INK;
  const sit=pose==='sit'||pose==='row';
  const tt=sit?-19:-24, hip=sit?-8:-11;
  const pd=POSE(pose,d,tt,hip);
  if(pd.lean){c.translate(0,0);c.transform(1,0,d*-.12,1,0,0);}
  c.lineWidth=1.5;
  for(const lg of pd.legs){
    const st=s.body==='dress'?[lg[0][0],lg[0][1]+2]:lg[0];
    c.beginPath();c.moveTo(st[0],st[1]);for(let i=1;i<lg.length;i++)c.lineTo(lg[i][0],lg[i][1]);c.stroke();
    const f=lg[lg.length-1];c.lineWidth=1.8;L(c,f[0]-.4,f[1],f[0]+d*1.5,f[1]);c.lineWidth=1.5;
  }
  if(pose==='run'){c.lineWidth=.5;for(let k=0;k<3;k++)L(c,-d*(9+k),tt+6+k*4,-d*(15+k*2),tt+6+k*4);}
  c.lineWidth=1.05;
  bodyPath(c,s,tt,hip);
  fillWith(c,s.fill||'white',[-8,tt-1,8,hip+5]);
  const dark=s.fill==='black';
  if(s.body==='suit'){P(c,[[0,tt+.4],[.95,tt+2],[0,tt+7.5],[-.95,tt+2]],dark?WHITE:INK);}
  else if(s.body==='coat'){D(c,0,tt+5,.5,dark?WHITE:INK);D(c,0,tt+8.5,.5,dark?WHITE:INK);}
  else if(s.body==='chef'){Rc(c,-3.4,tt+5,6.8,hip-tt-3,WHITE);}
  c.lineWidth=1.4;
  L(c,-d*3.8,tt+1.6,pd.B[0],pd.B[1]);
  L(c,d*3.8,tt+1.6,pd.F[0],pd.F[1]);
  c.lineWidth=.8;C(c,pd.B[0],pd.B[1],.95,WHITE);C(c,pd.F[0],pd.F[1],.95,WHITE);
  c.save();c.translate(0,tt-5.1);drawHead(c,s,d);c.restore();
  if(s.prop)drawProp(c,s.prop,pd.F[0],pd.F[1],d);
  if(sleeping){c.fillStyle=INK;c.font='7px "Patrick Hand", cursive';c.textAlign='left';c.fillText('z',6,tt-9);c.font='9px "Patrick Hand", cursive';c.fillText('Z',9,tt-14);}
  if(fallen){c.lineWidth=.6;for(const[sx,sy]of[[-7,-33],[6,-35],[0,-38]]){L(c,sx-1.3,sy,sx+1.3,sy);L(c,sx,sy-1.3,sx,sy+1.3);}}
  c.restore();
}


function drawGhost(c){
  c.strokeStyle=INK;c.lineWidth=1.1;c.beginPath();c.moveTo(-8,-1);c.lineTo(-8,-22);c.arc(0,-22,8,PI,0);c.lineTo(8,-1);
  for(let k=0;k<4;k++){c.quadraticCurveTo(6-k*4,-4,4-k*4,-1);}c.closePath();c.fillStyle=WHITE;c.fill();c.stroke();
  E(c,-3,-23,1.6,2.4,INK);E(c,3,-23,1.6,2.4,INK);E(c,0,-17,1.8,2.2,INK);
  c.lineWidth=.8;L(c,-8,-15,-12,-19);L(c,8,-15,12,-19);
}

/* =========================================================
   MOTEUR ISOMÉTRIQUE
   Coordonnées du sol (u,v), hauteur z.  Écran : x=u-v, y=(u+v)/2-z
   ========================================================= */
const BLK=240, ST=44, PITCH=284, DEP=40, SLAB=26;
const pr=(u,v,z)=>[u-v,(u+v)/2-(z||0)];
function ip(c,pts,f){P(c,pts.map(p=>pr(p[0],p[1],p[2]||0)),f);}
function drawBox(c,u0,v0,z0,w,d,h,ft,fl,fr){
  ip(c,[[u0,v0+d,z0],[u0+w,v0+d,z0],[u0+w,v0+d,z0+h],[u0,v0+d,z0+h]],fl||WHITE);
  ip(c,[[u0+w,v0+d,z0],[u0+w,v0,z0],[u0+w,v0,z0+h],[u0+w,v0+d,z0+h]],fr||'#ebe6da');
  ip(c,[[u0,v0,z0+h],[u0+w,v0,z0+h],[u0+w,v0+d,z0+h],[u0,v0+d,z0+h]],ft||WHITE);
}
/* faces : repère local (x vers la droite de l'écran, y vers le bas) */
function faceV(c,u0,v,ztop){c.transform(1,.5,0,1,u0-v,(u0+v)/2-ztop);}   // face v=cste, x le long de u
function faceU(c,u,v1,ztop){c.transform(1,-.5,0,1,u-v1,(u+v1)/2-ztop);} // face u=cste, x le long de -v
function groundT(c){c.transform(1,.5,-1,.5,0,0);}                         // dessin à plat sur le sol (u,v)

const DISTRICTS=[
  {id:'centre',name:'Le Centre',u0:0,v0:0,u1:896,v1:896,need:0},
  {id:'port',name:'Le Port',u0:896,v0:0,u1:1820,v1:896,need:3}

const items=[], topItems=[], groundL=[], areas=[], avoidC=[], avoidR=[], occupied=[], bld={};
let CURD=0;
function bbBox(u0,v0,u1,v1,ht){return[u0-v1-3,(u0+v0)/2-ht-3,u1-v0+3,(u1+v1)/2+3];}
function G(u0,v0,u1,v1,d){groundL.push({bb:bbBox(u0,v0,u1,v1,0),d,dist:CURD});}
function addBoxItem(u0,v0,u1,v1,ht,d){const it={key:(u0+u1+v0+v1)/2,fp:[u0,v0,u1,v1],box:true,bb:bbBox(u0,v0,u1,v1,ht),d,dist:CURD};items.push(it);return it;}
function addSpr(u,v,d,o){o=o||{};const[x,y]=pr(u,v,o.z||0);const it={key:u+v,fp:[u,v,u,v],box:false,bb:[x-(o.hw||24),y-(o.ht||52),x+(o.hw||24),y+(o.lo||8)],d:c=>d(c,x,y),dist:CURD};(o.top?topItems:items).push(it);return it;}

function avoid(u,v,r){avoidC.push({u,v,r});}
function avoidRect(u0,v0,u1,v1){avoidR.push([u0,v0,u1,v1]);}
function gp(c,pts,f){ip(c,pts.map(p=>[p[0],p[1],0]),f);}
function rectG(c,u0,v0,u1,v1,f){gp(c,[[u0,v0],[u1,v0],[u1,v1],[u0,v1]],f);}
function blk(i,j){const u0=ST+i*PITCH,v0=ST+j*PITCH;return{u0,v0,u1:u0+BLK,v1:v0+BLK,uc:u0+BLK/2,vc:v0+BLK/2};}
function groundText(c,u,v,txt,size){c.save();c.translate(...pr(u,v,0));groundT(c);c.font=`${size||16}px "Patrick Hand", cursive`;c.fillStyle=INK;c.textAlign='left';c.textBaseline='middle';c.fillText(txt,0,0);c.restore();}

/* tri : un objet passe devant une boîte s'il est au-delà d'elle sur u ou v */
function behind(a,b){return a.fp[2]<=b.fp[0]||a.fp[3]<=b.fp[1];}
function sortItems(){
  const n=items.length,adj=Array.from({length:n},()=>[]),indeg=new Int32Array(n);
  const cell=150,grid=new Map();
  items.forEach((it,i)=>{const b=it.bb;for(let gx=Math.floor(b[0]/cell);gx<=Math.floor(b[2]/cell);gx++)for(let gy=Math.floor(b[1]/cell);gy<=Math.floor(b[3]/cell);gy++){const k=gx*100003+gy;let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(i);}});
  const seen=new Set();
  for(const arr of grid.values())for(let x=0;x<arr.length;x++)for(let y=x+1;y<arr.length;y++){
    const i=arr[x],j=arr[y],A=items[i],B=items[j];if(!A.box&&!B.box)continue;
    const pk=i<j?i*n+j:j*n+i;if(seen.has(pk))continue;seen.add(pk);
    const a=A.bb,b=B.bb;if(a[2]<b[0]||b[2]<a[0]||a[3]<b[1]||b[3]<a[1])continue;
    const ab=behind(A,B),ba=behind(B,A);
    if(ab&&!ba){adj[i].push(j);indeg[j]++;}else if(ba&&!ab){adj[j].push(i);indeg[i]++;}
  }
  const heap=[],K=i=>items[i].key;
  const push=i=>{heap.push(i);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(K(heap[p])<=K(heap[k]))break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p;}};
  const pop=()=>{const r=heap[0],l=heap.pop();if(heap.length){heap[0]=l;let k=0;for(;;){const a=2*k+1,b=a+1;let m=k;if(a<heap.length&&K(heap[a])<K(heap[m]))m=a;if(b<heap.length&&K(heap[b])<K(heap[m]))m=b;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m;}}return r;};
  for(let i=0;i<n;i++)if(!indeg[i])push(i);
  const done=new Uint8Array(n),out=[];
  while(out.length<n){
    if(!heap.length){let best=-1;for(let i=0;i<n;i++)if(!done[i]&&(best<0||K(i)<K(best)))best=i;push(best);}
    const i=pop();if(done[i])continue;done[i]=1;out.push(items[i]);
    for(const j of adj[i])if(--indeg[j]===0&&!done[j])push(j);
  }
  items.length=0;items.push(...out);
}

/* ---------- objets du décor ---------- */
function addTree(u,v,k){
  k=k||R(.8,1.15);const blobs=[];const n=RI(5,7);
  for(let i=0;i<n;i++){const a=i/n*TAU+R(-.3,.3);blobs.push([Math.cos(a)*7*k,-24*k+Math.sin(a)*6*k,R(6,8)*k]);}
  blobs.push([0,-25*k,8.5*k]);const marks=[];for(let i=0;i<4;i++)marks.push([R(-8,8)*k,R(-30,-18)*k]);
  addSpr(u,v,(c,x,y)=>{c.strokeStyle=INK;c.lineWidth=.8;E(c,x,y,7*k,3.5*k,'#dcd6c6');c.lineWidth=1.1;
    P(c,[[x-1.8*k,y],[x-1.2*k,y-15*k],[x+1.2*k,y-15*k],[x+1.8*k,y]],WHITE);
    c.lineWidth=2.4;for(const b of blobs){c.beginPath();c.arc(x+b[0],y+b[1],b[2],0,TAU);c.stroke();}
    c.fillStyle=WHITE;for(const b of blobs){c.beginPath();c.arc(x+b[0],y+b[1],b[2],0,TAU);c.fill();}
    c.lineWidth=.6;for(const m of marks){c.beginPath();c.arc(x+m[0],y+m[1],2,PI*.2,PI*.9);c.stroke();}},{hw:24*k,ht:42*k});
  avoid(u,v,9);
}
function addPalm(u,v){addSpr(u,v,(c,x,y)=>{c.strokeStyle=INK;c.lineWidth=1;c.beginPath();c.moveTo(x-2,y);c.quadraticCurveTo(x-4,y-20,x+2,y-38);c.lineTo(x+4,y-38);c.quadraticCurveTo(x-1,y-20,x+2,y);c.closePath();c.fillStyle=WHITE;c.fill();c.stroke();
  for(let k=0;k<7;k++){const a=-PI/2+(k-3)*.45;c.beginPath();c.moveTo(x+3,y-38);c.quadraticCurveTo(x+3+Math.cos(a)*10,y-46+Math.sin(a)*6,x+3+Math.cos(a)*18,y-36+Math.sin(a)*8);c.lineWidth=2.6;c.stroke();c.lineWidth=1.2;c.strokeStyle=WHITE;c.stroke();c.strokeStyle=INK;c.lineWidth=1;}},{ht:56});avoid(u,v,8);}
function addBush(u,v,roses){const blobs=[];for(let i=0;i<4;i++)blobs.push([R(-7,7),R(-7,-3),R(3.5,5)]);

function randomSpec(beach){
  for(;;){const s={head:pick(HEADS),body:pick(BODIES),fill:pick(FILLS),hat:pick(HATS),prop:pick(PROPS),pose:pick(POSES),flip:rnd()<.5};
    if(beach){s.body=pick(['shirt','shirt','dress']);s.hat=pick(['none','none','straw','glasses','cap']);s.prop=pick([null,null,'icecream','ring','book','camera']);}
    if(RESERVED.has(s.head+'|'+s.fill))continue;
    if(s.head==='fox'&&s.hat==='cap')continue;if(s.head==='owl'&&s.hat==='beret')continue;if(s.head==='bear'&&s.hat==='top')continue;if(s.head==='cat'&&(s.prop==='flowers'||s.hat==='cap'))continue;if(s.head==='croc'&&s.prop==='sheet')continue;if(s.head==='penguin')s.hat='none';

function free(u,v,pad){
  for(const a of avoidC){const du=u-a.u,dv=v-a.v;if(du*du+dv*dv<(a.r+(pad||0))**2)return false;}
  for(const r of avoidR)if(u>r[0]&&u<r[2]&&v>r[1]&&v<r[3])return false;

  for(const cs of CASES){if(!unlocked(cs.dist))continue;const[x,y]=pr(cs.card[0],cs.card[1],0);const sx=(x-cam.x)*cam.s+vw/2,sy=(y-cam.y)*cam.s+vh/2;const sc=Math.max(.5,Math.min(1,cam.s*1.4));out.push({cs,x:sx-32*sc,y:sy-90*sc,w:64*sc,h:82*sc,a});}return out;}
function drawCards(c){for(const r of cardRects()){c.globalAlpha=r.a;c.drawImage(cardCanvas(r.cs),r.x,r.y,r.w,r.h);
  if(caseDone(r.cs)){c.save();c.translate(r.x+r.w*.5,r.y+r.h*.38);c.rotate(-.25);c.strokeStyle=RED;c.lineWidth=2.4;c.fillStyle='rgba(255,253,247,.85)';c.beginPath();c.rect(-26,-9,52,18);c.fill();c.stroke();c.fillStyle=RED;c.font='13px "Patrick Hand", cursive';c.textAlign='center';c.textBaseline='middle';c.fillText('CLASSÉE',0,1);c.restore();}
  else if(r.cs.id===state.current){c.strokeStyle=RED;c.lineWidth=3;c.strokeRect(r.x-3,r.y-3,r.w+2,r.h-1);}
  c.globalAlpha=1;}}
function hintCircle(cs,k){const t=cs.steps[k].t;const a=k*2.3+cs.id.length;return{x:t.x+Math.cos(a)*60,y:t.y+Math.sin(a)*40,r:150};}
function toWorld(sx,sy){return{x:cam.x+(sx-vw/2)/cam.s,y:cam.y+(sy-vh/2)/cam.s};}
function zoomAt(sx,sy,f){const w=toWorld(sx,sy);cam.s=Math.max(minS,Math.min(maxS,cam.s*f));cam.x=w.x-(sx-vw/2)/cam.s;cam.y=w.y-(sy-vh/2)/cam.s;clampCam();req();}
let anim=null;
function flyTo(x,y,s,ms){const a={x:cam.x,y:cam.y,s:cam.s},t0=performance.now();ms=ms||700;const id={};anim=id;
  const step=()=>{if(anim!==id)return;const p=Math.min(1,(performance.now()-t0)/ms),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;cam.s=a.s*Math.pow(s/a.s,e);cam.x=a.x+(x-a.x)*e;cam.y=a.y+(y-a.y)*e;clampCam();render();if(p<1)requestAnimationFrame(step);else anim=null;};requestAnimationFrame(step);}

/* ---------- gestes ---------- */
const ptrs=new Map();let tap=null,pinch=null;
cv.addEventListener('pointerdown',e=>{anim=null;cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)tap={x:e.clientX,y:e.clientY,t:performance.now(),moved:false};
  else if(ptrs.size===2){tap=null;const[p1,p2]=[...ptrs.values()];pinch={d:Math.hypot(p1.x-p2.x,p1.y-p2.y),s:cam.s,w:toWorld((p1.x+p2.x)/2,(p1.y+p2.y)/2)};}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===1){if(tap&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)>8)tap.moved=true;if(!tap||tap.moved){cam.x-=dx/cam.s;cam.y-=dy/cam.s;clampCam();req();}}
  else if(ptrs.size===2&&pinch){const[p1,p2]=[...ptrs.values()];const d=Math.hypot(p1.x-p2.x,p1.y-p2.y);const mx=(p1.x+p2.x)/2,my=(p1.y+p2.y)/2;cam.s=Math.max(minS,Math.min(maxS,pinch.s*d/pinch.d));cam.x=pinch.w.x-(mx-vw/2)/cam.s;cam.y=pinch.w.y-(my-vh/2)/cam.s;clampCam();req();}});
function up(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(!had)return;if(ptrs.size<2)pinch=null;
  if(tap&&!tap.moved&&ptrs.size===0&&performance.now()-tap.t<450)onTapScreen(e.clientX,e.clientY);tap=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*.0015));},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(vw/2,vh/2,1.6);
document.getElementById('zout').onclick=()=>zoomAt(vw/2,vh/2,1/1.6);
document.getElementById('zfit').onclick=()=>flyTo((WB.x0+WB.x1)/2,(WB.y0+WB.y1)/2,minS);
window.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='=')zoomAt(vw/2,vh/2,1.4);if(e.key==='-')zoomAt(vw/2,vh/2,1/1.4);});

/* =========================================================
   INTERFACE
   ========================================================= */
const curCase=()=>CASES.find(c=>c.id===state.current)||null;
function curStep(cs){const st=state.solved[cs.id]||[];for(let k=0;k<cs.steps.length;k++)if(!st[k])return k;return -1;}
const $=id=>document.getElementById(id);
let toastT=0;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1700);}
const stars=n=>'★'.repeat(n)+'☆'.repeat(3-n);
function updateCard(){const cs=curCase();
  if(!cs){$('caseTitle').textContent='Choisis une enquête ▸';$('stepNum').textContent='';$('question').textContent="Touche une carte d'enquête posée sur la ville, ou ouvre les Dossiers.";$('btnHint').disabled=true;return;}
  $('btnHint').disabled=false;const k=curStep(cs);$('caseTitle').textContent=cs.title+' ▸';
  if(k<0){$('stepNum').textContent='Classée ✓';$('question').textContent=cs.outro;}else{$('stepNum').textContent=`Étape ${k+1}/${cs.steps.length}`;$('question').textContent=cs.steps[k].q;}}
function portrait(spec){const c=document.createElement('canvas');const r=2;c.width=90*r;c.height=100*r;const g=c.getContext('2d');g.setTransform(r,0,0,r,0,0);g.fillStyle='#f3efe4';g.fillRect(0,0,90,100);g.strokeStyle='#d6d0c2';g.lineWidth=1;for(let y=10;y<100;y+=10){g.beginPath();g.moveTo(0,y);g.lineTo(90,y);g.stroke();}
  const sc=spec.scale?2.35/spec.scale*.75:2.35;g.translate(45,95);g.scale(sc,sc);drawChar(g,0,0,Object.assign({},spec,{pose:'stand'}));return c;}
function openModal(html,mount){$('modalBody').innerHTML=html;$('modal').classList.remove('hidden');if(mount)mount($('modalBody'));}
function closeModal(){$('modal').classList.add('hidden');}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.classList.contains('close'))closeModal();});
function castHTML(cs){return `<div class="cast">${cs.cast.map((p,i)=>`<div class="who"><div data-p="${i}"></div><b>${p.n}</b><span>${p.r}</span></div>`).join('')}</div>`;}
function mountCast(root,cs){root.querySelectorAll('[data-p]').forEach(el=>el.appendChild(portrait(cs.cast[+el.dataset.p].s)));}
function showCases(){
  openModal(`<h2>Dossiers</h2><p class="legend">Toute la ville est figée : un même suspect apparaît à plusieurs endroits, à différents moments. Résous des enquêtes pour débloquer de nouveaux quartiers.</p>${DISTRICTS.map((D,i)=>{const open=unlocked(i);
    return `<h3>${open?'':'🔒 '}${D.name}${open?` <span class="legend">${doneIn(i)}/${CASES.filter(c=>c.dist===i).length} classées</span>`:''}</h3>${open?`<div class="cases">${CASES.filter(c=>c.dist===i).map(cs=>{const n=(state.solved[cs.id]||[]).filter(Boolean).length;return`<button class="case ${cs.id===state.current?'active':''}" data-c="${cs.id}"><div><div class="t">${cs.title}</div><div class="m">${stars(cs.diff)} · ${cs.steps.length} étapes</div></div><span class="done">${n===cs.steps.length?'Classée ✓':n+'/'+cs.steps.length}</span></button>`;}).join('')}</div>`:`<p class="legend">Résous ${D.need} enquêtes du ${DISTRICTS[i-1].name.replace('Le ','')} pour ouvrir ce quartier (${Math.min(doneIn(i-1),D.need)}/${D.need}).</p>`}`;}).join('')}<button class="btn ghost" id="howto">Comment jouer ?</button>`,root=>{
    root.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>startCase(b.dataset.c));root.querySelector('#howto').onclick=showHelp;});}
function startCase(id){state.current=id;save();updateCard();req();const cs=curCase();
  openModal(`<h2>${cs.title}</h2><p class="legend">${DISTRICTS[cs.dist].name} · ${stars(cs.diff)}</p><p>${cs.intro}</p><h3>Les personnages</h3>${castHTML(cs)}<button class="btn" id="go">${curStep(cs)<0?'Revoir la carte':'Commencer l\'enquête'}</button>${(state.solved[cs.id]||[]).some(Boolean)?'<button class="btn ghost" id="reset">Recommencer cette enquête</button>':''}`,root=>{
    mountCast(root,cs);root.querySelector('#go').onclick=()=>{closeModal();const[x,y]=pr(cs.card[0],cs.card[1],0);flyTo(x,y-20,Math.max(cam.s,Math.min(1.2,vw/700)));};
    const r=root.querySelector('#reset');if(r)r.onclick=()=>{state.solved[cs.id]=[];Object.keys(state.hints).forEach(k=>{if(k.startsWith(cs.id+':'))delete state.hints[k];});save();updateCard();req();closeModal();toast('Enquête remise à zéro');};});}
function showSteps(){const cs=curCase();if(!cs){showCases();return;}const st=state.solved[cs.id]||[];const k=curStep(cs);
  openModal(`<h2>${cs.title}</h2><ul class="steps">${cs.steps.map((s,i)=>st[i]?`<li><span class="n">${i+1}</span>${s.q}<span class="ok">${s.ok}</span><button data-v="${i}">Voir sur la carte</button></li>`:i===k?`<li><span class="n" style="background:var(--ink);color:var(--card)">${i+1}</span>${s.q}</li>`:`<li class="lock">Étape ${i+1} — encore secrète</li>`).join('')}</ul>${k<0?`<p class="stamp">Enquête classée</p><p>${cs.outro}</p>`:''}`,root=>{
    root.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const t=cs.steps[+b.dataset.v].t;closeModal();flyTo(t.x,t.y,Math.max(cam.s,Math.min(3.2,Math.min(vw,vh)/(t.r*6))));});});}
function showHelp(){openModal(`<h2>Comment jouer</h2>
  <p>🔎 <b>Zoome</b> en pinçant l'écran (ou molette / boutons +/−) et <b>déplace-toi</b> en glissant le doigt.</p>
  <p>🃏 Les <b>cartes d'enquête</b> sont posées sur la ville. Touche-en une pour ouvrir l'enquête.</p>
  <p>🗺️ Le temps est <b>figé</b> : le même suspect apparaît plusieurs fois, à différents moments de l'histoire.</p>
  <p>👆 Quand tu as trouvé la scène qui répond à la question, <b>touche-la</b>. Si c'est juste, elle est entourée en rouge.</p>
  <p>🔓 Résous des enquêtes pour <b>débloquer de nouveaux quartiers</b>.</p>
  <p>💡 Bloqué ? Le bouton <b>Indice</b> entoure la zone où chercher.</p>
  <button class="btn" id="ok">C'est parti !</button>`,root=>root.querySelector('#ok').onclick=closeModal);}
function onTapScreen(sx,sy){
  const rs=cardRects();for(let i=rs.length-1;i>=0;i--){const r=rs[i];if(sx>=r.x&&sx<=r.x+r.w&&sy>=r.y&&sy<=r.y+r.h){startCase(r.cs.id);return;}}
  const w=toWorld(sx,sy);onTap(w.x,w.y);}
function onTap(x,y){
  const cs=curCase();if(!cs){toast('Touche une carte d\'enquête');return;}
  const k=curStep(cs);if(k<0){toast('Enquête déjà classée !');return;}
  const t=cs.steps[k].t,slack=Math.min(12,Math.max(0,8/cam.s-6));
  if(Math.hypot(x-t.x,y-t.y)<=t.r+slack){
    const before=DISTRICTS.map((d,i)=>unlocked(i));
    (state.solved[cs.id]=state.solved[cs.id]||[])[k]=true;save();fx.pulse={x:t.x,y:t.y,r:t.r,t:performance.now()};req();updateCard();
    const done=curStep(cs)<0;const newD=DISTRICTS.findIndex((d,i)=>unlocked(i)&&!before[i]);
    setTimeout(()=>openModal(`<h2>Bien vu !</h2><p>${cs.steps[k].ok}</p>${done?`<p class="stamp">Enquête classée</p><p>${cs.outro}</p>`:''}${newD>=0?`<h3>🔓 Nouveau quartier : ${DISTRICTS[newD].name} !</h3><p>De nouvelles enquêtes t'attendent.</p>`:''}<button class="btn" id="next">${newD>=0?'Découvrir '+DISTRICTS[newD].name:done?'Retour aux dossiers':'Étape suivante'}</button>`,root=>root.querySelector('#next').onclick=()=>{
      if(newD>=0){closeModal();const D=DISTRICTS[newD];const[x2,y2]=pr((D.u0+D.u1)/2,(D.v0+D.v1)/2,0);flyTo(x2,y2,Math.max(minS,vw/1300),1100);}else if(done){showCases();}else closeModal();}),450);
  }else{fx.wrong.push({x,y,t:performance.now()});req();toast(pick(['Rien de suspect ici…','Hmm, pas ici.','Continue de chercher !','Ce n\'est pas ça…']));}
}
$('btnCases').onclick=showCases;$('caseTitle').onclick=()=>curCase()?showSteps():showCases();$('btnSteps').onclick=showSteps;
$('btnCast').onclick=()=>{const cs=curCase();if(!cs){showCases();return;}openModal(`<h2>Personnages</h2><p class="legend">${cs.title}</p>${castHTML(cs)}`,root=>mountCast(root,cs));};
$('btnHint').onclick=()=>{const cs=curCase();if(!cs)return;const k=curStep(cs);if(k<0)return;state.hints[cs.id+':'+k]=true;save();const h=hintCircle(cs,k);flyTo(h.x,h.y,Math.max(minS,Math.min(vw,vh)/(h.r*2.6)));toast('La scène est dans le cercle rouge');};

/* ---------- démarrage ---------- */
buildCity();
window.addEventListener('resize',resize);resize();
{const[x,y]=pr(448,448,0);cam.x=x;cam.y=y-40;cam.s=Math.max(minS,Math.min(1,vw/1150));clampCam();}
updateCard();render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{cache=null;for(const k in cardImg)delete cardImg[k];req();});
if(!state.seen){state.seen=true;save();showHelp();}
window.__animopolis={CASES,cam,onTap,flyTo,render,state,items,DISTRICTS,pr,unlocked};
</script>
