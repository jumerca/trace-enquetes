<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRACE.</title>
<style>
html,body{margin:0;min-height:100%;background:#090d11;color:#f2eadc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:grid;place-items:center;min-height:100vh}.box{max-width:620px;padding:28px}.muted{color:#9ba7b3}.err{color:#ef8585}a{color:#f2eadc}
</style>
</head>
<body>
<div class="box" id="status"><h1>TRACE.</h1><p class="muted">Connexion sécurisée en cours…</p></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
  const status=document.getElementById('status');
  const SUPABASE_URL='https://pymragemvcfxmqiyjqhy.supabase.co';
  const SUPABASE_KEY='sb_publishable_QWF58VWTEpScqo588mUzSQ_bYLIewgE';
  const qs=new URLSearchParams(location.search);
  const hs=new URLSearchParams(location.hash.startsWith('#')?location.hash.slice(1):location.hash);
  const oauthReturn=qs.has('code')||qs.has('error')||hs.has('access_token')||hs.has('refresh_token')||hs.has('error');
  const safeError=qs.get('error_description')||qs.get('error')||hs.get('error_description')||hs.get('error');
  try{
    if(safeError) throw new Error(safeError);
    const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    await new Promise(r=>setTimeout(r,700));
    let {data,error}=await client.auth.getSession();
    if(error) throw error;
    let session=data?.session||null;

    if(!session && qs.get('code')){
      const exchanged=await client.auth.exchangeCodeForSession(qs.get('code'));
      if(exchanged.error) throw exchanged.error;
      session=exchanged.data?.session||null;
    }

    if(!session && hs.get('access_token') && hs.get('refresh_token')){
      const set=await client.auth.setSession({access_token:hs.get('access_token'),refresh_token:hs.get('refresh_token')});
      if(set.error) throw set.error;
      session=set.data?.session||null;
    }

    if(oauthReturn && !session){
      throw new Error('Le retour Google a été reçu, mais Supabase n’a créé aucune session.');
    }

    if(session && (location.search||location.hash)){
      history.replaceState({},'',location.pathname);
    }

    const response=await fetch('./index-1.html',{cache:'no-store'});
    if(!response.ok) throw new Error('Impossible de charger TRACE (HTTP '+response.status+').');
    const html=await response.text();
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    const msg=String(err?.message||err||'Erreur inconnue');
    status.innerHTML='<h1>TRACE.</h1><h2 class="err">Connexion non finalisée</h2><p>'+msg.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+'</p><p class="muted">Cette page a conservé le diagnostic du retour Google sans afficher les jetons de connexion.</p><p><a href="./auth-debug.html">Ouvrir le diagnostic Supabase</a></p><p><a href="./">Réessayer</a></p>';
  }
})();
</script>
</body>
</html>
