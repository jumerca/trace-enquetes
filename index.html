<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRACE.</title>
<style>html,body{margin:0;min-height:100%;background:#090d11;color:#f2eadc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;min-height:100vh}.box{max-width:560px;padding:28px;text-align:center}.muted{color:#9ba7b3}.bad{color:#ef8585;white-space:pre-wrap;word-break:break-word}</style>
</head>
<body><div class="box"><h1>TRACE.</h1><p id="status" class="muted">Chargement…</p></div>
<script>
(async()=>{
const SUPA_URL='https://pymragemvcfxmqiyjqhy.supabase.co';
const SUPA_KEY='sb_publishable_QWF58VWTEpScqo588mUzSQ_bYLIewgE';
const ROOT='https://jumerca.github.io/trace-enquetes/';
const status=document.getElementById('status');
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('Bibliothèque Supabase indisponible'));document.head.appendChild(s)})}
try{
  await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');
  const params=new URLSearchParams(location.search);
  const oauthError=params.get('error')||params.get('error_code');
  const oauthDesc=params.get('error_description')||params.get('error_description');
  if(oauthError){
    localStorage.setItem('trace-oauth-error',oauthError+(oauthDesc?' — '+oauthDesc:''));
    throw new Error('Connexion Google refusée : '+oauthError+(oauthDesc?' — '+oauthDesc:''));
  }
  const code=params.get('code');
  if(code){
    status.textContent='Connexion Google en cours…';
    const callbackClient=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
    const {data,error}=await callbackClient.auth.exchangeCodeForSession(code);
    if(error) throw error;
    if(!data?.session?.user) throw new Error('Aucune session reçue après le retour Google.');
    localStorage.removeItem('trace-oauth-error');
    localStorage.setItem('trace-oauth-ok',Date.now().toString());
    history.replaceState({},'',location.pathname);
  }
  const res=await fetch('./index-1.html?v=oauth-pkce-1',{cache:'no-store'});
  if(!res.ok) throw new Error('Impossible de charger TRACE ('+res.status+').');
  let html=await res.text();
  const patch=`<script>(function installTracePkce(){if(!window.TraceCloud||!window.supabase){setTimeout(installTracePkce,50);return;}window.TraceCloud.signInGoogle=async function(){localStorage.removeItem('trace-oauth-error');const c=window.supabase.createClient('${SUPA_URL}','${SUPA_KEY}',{auth:{flowType:'pkce',persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const r=await c.auth.signInWithOAuth({provider:'google',options:{redirectTo:'${ROOT}'}});if(r.error)throw r.error;};})();<\/script>`;
  html=html.replace(/<\/body>\s*<\/html>\s*$/i,patch+'</body></html>');
  document.open();document.write(html);document.close();
}catch(e){
  status.className='bad';
  status.textContent=e.message||String(e);
  const p=document.createElement('p');p.innerHTML='<a style="color:#f2eadc" href="./">Réessayer</a>';
  document.querySelector('.box').appendChild(p);
}
})();
</script>
</body></html>
