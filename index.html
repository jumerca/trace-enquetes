<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TRACE.</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#090d11;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0;background:#090d11}
</style>
</head>
<body>
<iframe id="traceApp" src="index-1.html" title="TRACE"></iframe>
<script>
const frame=document.getElementById('traceApp');
function applyHomeRules(){
  try{
    const d=frame.contentDocument;
    if(!d)return;
    d.querySelectorAll('.v12-sidebar nav button').forEach(btn=>{
      const txt=(btn.textContent||'').trim().toLowerCase();
      if(txt.includes('preuves')) btn.style.display='none';
    });
  }catch(e){}
}
frame.addEventListener('load',()=>{
  applyHomeRules();
  try{
    const d=frame.contentDocument;
    new MutationObserver(applyHomeRules).observe(d.documentElement,{childList:true,subtree:true});
  }catch(e){}
});
</script>
</body>
</html>
