<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>TRACE.</title><link rel="manifest" href="./manifest.webmanifest?v=2"><link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png?v=2"><link rel="shortcut icon" href="./icon-192.png?v=2"><link rel="apple-touch-icon" href="./icon-192.png?v=2"><style>html,body{margin:0;min-height:100%;background:#080b10;color:#f4efe5;font-family:system-ui,sans-serif}body{display:grid;place-items:center}.load{opacity:.75;letter-spacing:.08em}</style></head><body><div class="load">Chargement de TRACE…</div><script>
(async()=>{
try{
 const r=await fetch('./index-1.html?v=local-v15',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let h=await r.text();
 const start=h.indexOf('<script>// TRACE V14');const end=h.indexOf('<script>const CASES=',start);if(start<0||end<0)throw new Error('Version TRACE incompatible');
 const stub='<script>// TRACE V15 LOCAL — aucun compte, aucune synchronisation cloud\nwindow.TRACE_CLOUD_CONFIG={supabaseUrl:"",supabaseKey:""};\nwindow.TraceCloud={state:{configured:false,ready:true,user:null,status:"local",lastSync:null,error:null,syncing:false},init:async()=>{},schedulePush:()=>{},syncNow:async()=>{},signOut:async()=>{},signInEmail:async()=>{throw new Error("Les comptes ont été supprimés de TRACE.")},signUpEmail:async()=>{throw new Error("Les comptes ont été supprimés de TRACE.")},signInGoogle:async()=>{throw new Error("La connexion Google a été supprimée de TRACE.")},configure:async()=>{},clearConfig:()=>{},mergeProgress:(local)=>local||{}};\n<\/script>';
 h=h.slice(0,start)+stub+h.slice(end);
 const oldSettings="let body=kind==='parametres'?`<p>${cloudState().user?'Progression locale + synchronisation cloud activée.':'La progression est enregistrée sur cet appareil. Le compte cloud reste optionnel.'}</p><button class=\"btn\" onclick=\"this.closest('.overlay').remove();openAuthModal()\">☁ ${cloudState().user?'Gérer mon compte':'Connexion & synchronisation'}</button><button class=\"btn danger\" onclick=\"resetAll()\">Réinitialiser toute la progression</button>`:";
 const newSettings="let body=kind==='parametres'?`<p><b>Sauvegarde automatique locale activée.</b><br>Ta progression est enregistrée sur cet appareil, sans compte et sans connexion.</p><div class=\"auth-actions\"><button class=\"btn primary\" onclick=\"exportLocalSave()\">⇩ Exporter ma sauvegarde</button><button class=\"btn\" onclick=\"importLocalSave()\">⇧ Importer une sauvegarde</button><button class=\"btn danger\" onclick=\"resetAll()\">Réinitialiser toute la progression</button></div><small class=\"privacy-copy\">Exporte une sauvegarde avant de désinstaller l’application ou d’effacer ses données.</small>`:";
 if(!h.includes(oldSettings))throw new Error('Bloc paramètres introuvable');h=h.replace(oldSettings,newSettings);
 h=h.replace(/function cloudAccountButton\(\)\{[\s\S]*?\n\}/,'function cloudAccountButton(){\n return `<div class="cloud-account connected" data-cloud-account style="cursor:default"><span>✓</span><div><b>Sauvegarde locale</b><small>Automatique sur cet appareil</small></div></div>`;\n}');
 h=h.replace('<button onclick="openAuthModal()"><span>☁</span>Compte</button>','');
 const saveNeedle='function save(){localStorage.setItem(stateKey,JSON.stringify(progress));if(window.TraceCloud)TraceCloud.schedulePush(progress)}';
 const helpers=`${saveNeedle}\nfunction exportLocalSave(){try{save();const payload={app:'TRACE',version:15,exportedAt:new Date().toISOString(),progress};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='TRACE-sauvegarde-'+new Date().toISOString().slice(0,10)+'.trace.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);toast('Sauvegarde exportée.')}catch(e){toast('Impossible d’exporter la sauvegarde.')}}\nfunction importLocalSave(){const input=document.createElement('input');input.type='file';input.accept='.json,.trace.json,application/json';input.onchange=async()=>{const file=input.files&&input.files[0];if(!file)return;try{const data=JSON.parse(await file.text());const incoming=data&&data.progress?data.progress:data;if(!incoming||typeof incoming!=='object'||Array.isArray(incoming))throw new Error('format');if(!confirm('Importer cette sauvegarde TRACE ? La progression actuelle sera remplacée.'))return;progress=incoming;localStorage.setItem(stateKey,JSON.stringify(progress));renderHome();toast('Sauvegarde importée.')}catch(e){alert('Ce fichier n’est pas une sauvegarde TRACE valide.')}};input.click()}`;
 if(!h.includes(saveNeedle))throw new Error('Sauvegarde locale introuvable');h=h.replace(saveNeedle,helpers);
 h=h.replace("window.addEventListener('tracecloudstate',()=>{if(!currentCase&&!document.querySelector('.auth-overlay'))renderHome()});",'');
 h=h.replaceAll('COMPTE TRACE · OPTIONNEL','SAUVEGARDE TRACE · LOCALE');
 h=h.replaceAll('Continue à jouer sans compte, ou connecte-toi pour synchroniser tes dossiers entre téléphone, tablette et ordinateur.','La progression est sauvegardée automatiquement sur cet appareil.');
 h=h.replace('<body>','<body><script>try{localStorage.removeItem("trace-supabase-url");localStorage.removeItem("trace-supabase-key");Object.keys(localStorage).filter(k=>k.startsWith("sb-")||k.includes("supabase.auth")).forEach(k=>localStorage.removeItem(k));}catch(e){}<\/script>');
 document.open();document.write(h);document.close();
}catch(e){document.body.innerHTML='<div style="padding:24px;max-width:560px"><h1>TRACE.</h1><p>Impossible de charger la version locale.</p><p style="opacity:.7">'+String(e.message||e)+'</p><p><a style="color:#f4efe5" href="./index-1.html">Ouvrir la version de secours</a></p></div>'}
})();
</script></body></html>
