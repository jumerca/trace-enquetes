<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2c4d"/><stop offset="0.55" stop-color="#101827"/><stop offset="1" stop-color="#070b14"/></linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.2" r="0.7"><stop offset="0" stop-color="#3988F5" stop-opacity="0.55"/><stop offset="1" stop-color="#3988F5" stop-opacity="0"/></radialGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#F36B32" stop-opacity="0"/><stop offset="0.35" stop-color="#F36B32"/><stop offset="1" stop-color="#FFD98A"/></linearGradient>
    <radialGradient id="ball" cx="0.34" cy="0.28" r="0.85"><stop offset="0" stop-color="#ffb07a"/><stop offset="0.5" stop-color="#F36B32"/><stop offset="1" stop-color="#a53c12"/></radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#DDB65A"/></linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#glow)"/>
    <!-- lignes de parquet -->
    <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="10"><path d="M-20 420 L540 330"/><path d="M-20 480 L540 390"/></g>
    <!-- trajectoire ascendante -->
    <path d="M40 452 C 170 430, 300 320, 398 120" fill="none" stroke="url(#arc)" stroke-width="34" stroke-linecap="round"/>
    <path d="M96 476 C 210 452, 320 370, 392 250" fill="none" stroke="#3988F5" stroke-opacity="0.45" stroke-width="12" stroke-linecap="round"/>
    <!-- ballon -->
    <g transform="translate(214 306)">
      <circle r="128" fill="#000" opacity="0.25" transform="translate(8 12)"/>
      <circle r="124" fill="url(#ball)"/>
      <g fill="none" stroke="#2a1206" stroke-width="11" stroke-linecap="round" opacity="0.88">
        <path d="M0 -124 C 46 -54, 46 54, 0 124"/>
        <path d="M-124 0 H 124"/>
        <path d="M-88 -88 C -34 -36, -34 36, -88 88"/>
        <path d="M88 -88 C 34 -36, 34 36, 88 88"/>
      </g>
      <path d="M-70 -84 A 104 104 0 0 1 34 -104" stroke="#fff" stroke-opacity="0.4" stroke-width="14" fill="none" stroke-linecap="round"/>
    </g>
    <!-- étoile -->
    <path d="M404 40 L424 92 L478 96 L436 130 L450 184 L404 154 L358 184 L372 130 L330 96 L384 92 Z" fill="url(#star)" stroke="#8a6a22" stroke-width="3" stroke-linejoin="round"/>
    <path d="M404 62 L416 100 L404 96 Z" fill="#fff" opacity="0.5"/>
  </g>
