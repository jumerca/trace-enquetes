<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRACE — Réinitialisation connexion</title></head><body style="font-family:system-ui;background:#090d11;color:#f2eadc;display:grid;place-items:center;min-height:100vh;margin:0"><div style="max-width:520px;padding:24px;text-align:center"><h1>TRACE.</h1><p>Nettoyage de l’ancienne session de connexion…</p><p style="color:#9ba7b3">Votre progression de jeu est conservée.</p></div><script>(()=>{for(const k of Object.keys(localStorage)){if(k.startsWith('sb-')||k.includes('supabase.auth')) localStorage.removeItem(k);}localStorage.removeItem('trace-supabase-url');localStorage.removeItem('trace-supabase-key');sessionStorage.clear();setTimeout(()=>location.replace('./?oauth=fresh'),500);})();</script></body></html>
