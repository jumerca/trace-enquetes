<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRACE — Diagnostic connexion</title><style>body{font-family:system-ui;background:#090d11;color:#f2eadc;margin:0;padding:22px}main{max-width:720px;margin:auto}.card{background:#121a23;border:1px solid #33414f;border-radius:16px;padding:18px;margin:14px 0}h1{margin:0 0 8px}.ok{color:#8ed0ad}.bad{color:#ef8585}.muted{color:#9ba7b3;word-break:break-word}code{white-space:pre-wrap;word-break:break-word}button,a{display:inline-block;margin-top:10px;padding:11px 14px;border-radius:10px;border:1px solid #516273;background:#1c2530;color:#f2eadc;text-decoration:none;font-weight:700}</style></head><body><main><h1>TRACE.</h1><p class="muted">Diagnostic de la connexion Google/Supabase</p><div id="out" class="card">Analyse en cours…</div><a href="./">Retour à TRACE</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const out=document.getElementById('out');const url='https://pymragemvcfxmqiyjqhy.supabase.co';const key='sb_publishable_QWF58VWTEpScqo588mUzSQ_bYLIewgE';function esc(s){return String(s??'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}let html='';try{html+='<p><b>Adresse :</b><br><code>'+esc(location.href)+'</code></p>';const authKeys=Object.keys(localStorage).filter(k=>k.includes('supabase')||k.startsWith('sb-'));html+='<p><b>Clés de session trouvées :</b> '+authKeys.length+'</p>';if(authKeys.length)html+='<p class="muted"><code>'+esc(authKeys.join('\n'))+'</code></p>';const c=window.supabase.createClient(url,key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const {data,error}=await c.auth.getSession();if(error) throw error;if(data.session?.user){html+='<h2 class="ok">✅ Session trouvée</h2><p><b>Compte :</b> '+esc(data.session.user.email||data.session.user.id)+'</p><p class="muted">La connexion Google fonctionne. Le problème est alors uniquement l’affichage de TRACE.</p>'}else{html+='<h2 class="bad">❌ Aucune session</h2><p class="muted">Google revient bien vers le site, mais la session Supabase n’est pas enregistrée sur ce navigateur.</p>'}const params=new URLSearchParams(location.search);if(params.size){html+='<p><b>Paramètres retour :</b><br><code>'+esc(location.search)+'</code></p>'}if(location.hash){html+='<p><b>Fragment retour présent :</b> oui</p>'}out.innerHTML=html;}catch(e){out.innerHTML='<h2 class="bad">Erreur diagnostic</h2><p><code>'+esc(e.message||e)+'</code></p>'+html;}})();</script></body></html>
