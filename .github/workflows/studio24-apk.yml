name: Build Studio 24 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'studio24-android/**'
      - '.github/workflows/studio24-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable APK
        working-directory: studio24-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp studio24-android/app/build/outputs/apk/debug/app-debug.apk Studio24-V8.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete studio24-v8-apk --cleanup-tag -y || true
          gh release create studio24-v8-apk Studio24-V8.apk \
            --title "Studio 24 V8 — Android" \
            --notes "APK Android de Studio 24. Le moteur du jeu est chargé depuis l’URL officielle, donc les prochaines versions web du jeu arrivent sans réinstaller l’APK."

      - name: Publish direct APK on GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          cp Studio24-V8.apk studio24/Studio24.apk
          git add studio24/Studio24.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish Studio 24 Android APK direct download"
            git push origin main
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Studio24-V8-APK
          path: Studio24-V8.apk
