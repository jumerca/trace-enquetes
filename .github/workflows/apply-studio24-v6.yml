name: Apply Studio 24 V6

on:
  push:
    branches: [main]
    paths:
      - "studio24/v6-enhance.js"
      - "studio24/v6.css"
      - ".github/workflows/apply-studio24-v6.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire Studio 24 V6 assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('studio24/index.html')
          s=p.read_text()
          if 'v6.css' not in s:
              s=s.replace('<link rel="stylesheet" href="mobile.css" />','<link rel="stylesheet" href="mobile.css" />\n  <link rel="stylesheet" href="v6.css" />')
          if 'v6-enhance.js' not in s:
              s=s.replace('<script src="app-engine.js"></script>','<script src="app-engine.js"></script>\n  <script src="v6-enhance.js"></script>')
          s=s.replace('V5 PREMIUM','V6 LIVING NETWORK').replace('V5 Premium Edition','V6 Living Network').replace('<b>V5</b>','<b>V6</b>')
          p.write_text(s)
          sw=Path('studio24/sw.js')
          sw.write_text("""const CACHE='studio24-v6-living-1';
const ASSETS=['./','index.html','styles.css','mobile.css','v6.css','app-core.js','app-pages.js','app-engine.js','v6-enhance.js','manifest.json','icon.svg'];
self.addEventListener('install',e=>e.waitUntil(caches.open(CACHE).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting())));
self.addEventListener('activate',e=>e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim())));
self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(resp=>{const copy=resp.clone();caches.open(CACHE).then(c=>c.put(e.request,copy));return resp;}).catch(()=>caches.match(e.request).then(r=>r||caches.match('index.html'))))});
""")
          PY
      - name: Validate Studio 24 V6
        run: |
          grep -q "v6.css" studio24/index.html
          grep -q "v6-enhance.js" studio24/index.html
          grep -q "studio24-v6-living-1" studio24/sw.js
          grep -q "Grille TV hebdomadaire" studio24/v6-enhance.js
          grep -q "Mercato TV" studio24/v6-enhance.js
      - name: Commit V6 wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add studio24/index.html studio24/sw.js
          if git diff --cached --quiet; then
            echo "No wiring changes"
          else
            git commit -m "Activate Studio 24 V6 Living Network"
            git push
          fi
