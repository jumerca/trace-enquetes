name: Apply TRACE V17 quality pass

on:
  push:
    branches: [main]
    paths:
      - "tools/apply_v17.py"
      - ".github/workflows/apply-v17.yml"
      - "media/chambre17-plan.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin
      - name: Apply TRACE V17
        run: python tools/apply_v17.py
      - name: Validate V17 corrections
        run: |
          test -s media/chambre17-cctv.mp4
          test -s media/chambre17-plan.svg
          test $(stat -c%s media/chambre17-cctv.mp4) -gt 50000
          grep -q "TRACE V17 QUALITY PASS" index-1.html
          grep -q "local-v17" index.html
          grep -q "aucune limite" index-1.html
          grep -q "ccebab9f-b8cb-4c9e-8151-313bac2b99ef.wav" index-1.html
          grep -q "chambre17-plan.svg?v=17" index-1.html
          grep -q "chambre17-cctv.mp4?v=17" index-1.html
      - name: Commit V17 output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-1.html media/chambre17-cctv.mp4
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "Apply TRACE V17 investigation corrections"
            git push
          fi
